# Скопируйте в config.toml и поправьте пути.

[server]
# Слушаем только локально: наружу сервер выставляет Tailscale (HTTPS + доступ только своим устройствам).
host = "127.0.0.1"
port = 8080
trust_proxy = true

[storage]
# Основной диск (Windows-пути пишите через / ).
primary = "D:/FamilyCloud"
# Второй ФИЗИЧЕСКИЙ диск — полная копия каждого файла. Оставьте "" чтобы отключить (не рекомендуется).
mirror = "E:/FamilyCloud"
# Не принимать файлы, если на любом из дисков останется меньше:
min_free_gb = 10

[security]
token_days = 180          # через сколько дней телефону нужно войти заново
max_login_attempts = 5    # после 5 неверных паролей —
lockout_minutes = 15      # блокировка на 15 минут
max_file_gb = 50
chunk_max_mb = 16
